name: glossa_app
description: "Glossa — RPG-style heritage language learning app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0
  lottie: ^3.8.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/branding/
    - assets/animations/
    - assets/characters/
    - assets/icons/

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Regular.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/Logo.png"
  min_sdk_android: 21
