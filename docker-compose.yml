services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: glossa
      POSTGRES_PASSWORD: glossa
      POSTGRES_DB: glossa
    ports:
      - "5432:5432"
    volumes:
      - glossa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glossa -d glossa"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://glossa:glossa@db:5432/glossa
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-before-deployment}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && python seed.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"
volumes:
  glossa_pgdata:
